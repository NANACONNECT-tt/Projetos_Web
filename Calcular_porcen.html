<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Porcentagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="script_calc.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #121212 0%, #2a0808 100%), 
                        radial-gradient(circle, rgba(229, 9, 20, 0.15) 0%, transparent 70%);
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Principal da Calculadora */
        .container {
            background-color: #181818;
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            border-radius: 12px;
            /* Borda temática lateral e superior */
            border: 2px solid #e50914;
            border-left: 8px solid #e50914;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 
                        0 0 15px rgba(229, 9, 20, 0.2);
            color: #ffffff;
        }

        /* Título e Subtítulo Centralizados */
        h1 {
            font-size: 24px;
            text-align: center;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(229, 9, 20, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitulo {
            text-align: center;
            font-size: 13px;
            color: #b3b3b3;
            margin-bottom: 15px;
            font-style: italic;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #e50914, transparent);
            margin-bottom: 20px;
        }

        /* Formulário e Inputs */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #e5e5e5;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #262626;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #e50914;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        input[type="submit"] {
            background-color: #e50914;
            color: #ffffff;
        }

        input[type="submit"]:hover {
            background-color: #b20710;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
        }

        input[type="reset"] {
            background-color: #333333;
            color: #cccccc;
        }

        input[type="reset"]:hover {
            background-color: #444444;
            color: #ffffff;
        }

        /* Box de Resultados */
        .resultado-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f0f0f;
            border-radius: 6px;
            border-left: 4px solid #e50914;
        }

        .resultado-box h3 {
            font-size: 16px;
            color: #e50914;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .resultado-box p {
            font-size: 14px;
            color: #d1d1d1;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form onsubmit="event.preventDefault(); cal_restaurante();">
            <h1>Calcular Porcentagem</h1>
            <p class="subtitulo">O sabor começa aqui!</p>
            <hr>

            <label for="Valor">Valor total (R$):</label>
            <input type="text" id="Valor" placeholder="Ex: 150,00">

            <label for="Pessoas">N° de Pessoas:</label>
            <input type="number" id="Pessoas" min="1" placeholder="Ex: 2">
            
            <div class="btn-group">
                <input type="submit" value="Calcular">
                <input type="reset" value="Limpar">
            </div>
        </form>
        
        <div class="resultado-box">
            <h3>Resultado</h3>
            <p id="resultado1"></p>
            <p id="resultado2"></p>
            <p id="resultado3"></p>
            <p id="resultado4"></p>
        </div>
    </div>
</body>
</html>
