<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portifólio</title>
    <link rel="icon" href="https://img.icons8.com/?size=100&id=qrOXrfUDKkOX&format=png&color=000000">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e6d7ff 0%, #ffffff 100%);
    color: #4a2e80;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

header {
    background-color: #8a2be2;
    color: #ffffff;
    text-align: center;
    padding: 2rem 1rem;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

header h1 {
    font-size: 2rem;
}
.card {
    background-color: #ffffff;
    border: 2px solid #d8bfd8;
    border-radius: 12px;
    padding: 1.5rem;
    text-align: center;
    box-shadow: 0 6px 15px rgba(138, 43, 226, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    
    /* Define largura e altura fixas para manter os dois cards iguais */
    width: 320px;
    height: 380px;
    
    /* Alinha o conteúdo verticalmente */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 20px rgba(138, 43, 226, 0.25);
}

.card h4 {
    font-size: 1.2rem;
    color: #6a0dad;
    /* Define uma altura fixa para os títulos para que imagens fiquem no mesmo alinhamento */
    height: 2.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card a {
    display: block;
    width: 100%;
}

.card img {
    /* Força todas as imagens a terem o mesmo tamanho exato */
    width: 250px;
    height: 250px;
    object-fit: cover; /* Mantém a proporção sem distorcer a imagem */
    border-radius: 8px;
    transition: opacity 0.3s ease;
}

.card img:hover {
    opacity: 0.9;
}
.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    padding: 3rem 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
}

footer {
    background-color: #6a0dad;
    color: #ffffff;
    text-align: center;
    padding: 1rem;
    font-size: 0.9rem;
}

/* Ajustes para telas menores (Celulares) */
@media (max-width: 600px) {
    header h1 {
        font-size: 1.5rem;
    }
    
    .container {
        padding: 1.5rem 1rem;
        gap: 1.5rem;
    }
}
</style>
</head>
<body>
    <header>
        <h1>Portfólio de Projetos Web</h1>
    </header>
    
    <main class="container">

            </a>
        </div>
        
        <div class="card">

            </a>
        </div>
         <div class="card">
            <h4>Turismo do Japão</h4>
            <a href="https://nanaconnect-tt.github.io/Turismo-Japao-/">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2BV0s-ex8pUHMDW_wiyEW6jRxU-KdYtK9F7Viy7yM2xQqSt1xJ6DOSIk&s=10" alt="Página de Turismo">

        </div>
        <div class="card">

    </main>
