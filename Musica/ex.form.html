<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosno</title>
    <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=31203&format=png&color=000000" type="image/x-icon">
</head>
<body bgcolor="A9B4DB">
    <h1>Fale conosco</h1>
    <Form style="font-size: 30px";>
        Nome: <input style="font-size: 20px" type="text" placeholder="Digite seu nome completo"><br>
        <br>
        E-mail: <input style="font-size: 20px" type="email" placeholder="E-mail" required><br>
        <br>
        Telefone: <input style="font-size: 20px" type="tel" placeholder="(xx) xxxxx-xxxx" readonly><br>
        <br>
        Nascimento: <input style="font-size: 20px" type="date"><br>
        <br>
        Sexo: <input style="font-size: 20px" type="radio" name="sexo" >Ferminino
              <input style="font-size: 20px" type="radio" name="sexo" >Masculino
              <input style="font-size: 20px" type="radio" name="sexo" >Outros<br>
        <br>
        Cidade: <select style="font-size: 20px" name="" id="">
             <option value=""> </option>
            <option value="">Natal</option>
            <option value="">SGA</option>
            <option value="">Extremoz</option>
            <option value="">Parnamirim</option>
            <option value="">Estivas</option>

        </select><br>
        <br>
        Número: <input type="number" min="0" max="10">
        Hora: <input type="time"><br>
        <br>
        O que você deseja visitar?<br>
        <input type="checkbox"> Praias<br>
        <input type="checkbox"> Parque<br>
        <input type="checkbox"> Piscina<br>
        <input type="checkbox"> Shopping<br>
        <br>
        Insira sua sugestão/dúvida: <br>
        <textarea name="" id="" rows="10" cols="40"></textarea><br>
        Cor: <input type="color"><br>
        <br>
        Senha: <input type="password"><br>
        <br>
        Inserir Arquivo: <input type="file"><br>
        <br>
        <input type="reset" value="Limpar">
        <input type="submit" value="Enviar" onclick="alert('Enviado com sucesso!')">
        <button> Botão </button>
        </Form>
</body>
</html>
